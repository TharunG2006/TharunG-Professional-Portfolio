    <rect x="580" y="440" width="150" height="38" rx="8" fill="#1e293b"/>
    <text x="600" y="464" fill="#f43f5e">CTF: ragefrost</text>
  </g>

  <text x="960" y="530" fill="#64748b" font-family="monospace" font-size="13">tharung.me</text>
