<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-og" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#080e21"/>
      <stop offset="100%" stop-color="#050a18"/>
    </linearGradient>
    <linearGradient id="glow-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-og)"/>

  <!-- Starfield points -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="100" cy="80" r="1.5"/><circle cx="300" cy="150" r="1.2"/><circle cx="500" cy="70" r="2"/>
    <circle cx="750" cy="120" r="1.5"/><circle cx="950" cy="90" r="1.8"/><circle cx="1100" cy="180" r="1.2"/>
    <circle cx="180" cy="450" r="1.4"/><circle cx="420" cy="520" r="2"/><circle cx="880" cy="480" r="1.6"/>
  </g>

  <!-- Cyber frame -->
  <rect x="60" y="60" width="1080" height="510" rx="16" fill="none" stroke="#1e293b" stroke-width="2"/>
  
  <rect x="100" y="100" width="220" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="120" y="122" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">● CYBERNEXUS // ONLINE</text>

  <text x="100" y="210" fill="#f8fafc" font-family="sans-serif" font-size="56" font-weight="800" letter-spacing="-1">Tharun G</text>
  
  <text x="100" y="270" fill="url(#glow-text)" font-family="sans-serif" font-size="28" font-weight="700">Cybersecurity | AI/ML | Space &amp; Earth Observation</text>
  
  <text x="100" y="340" fill="#94a3b8" font-family="sans-serif" font-size="20" font-weight="400">Third-year CSE student at National Engineering College.</text>
  <text x="100" y="375" fill="#94a3b8" font-family="sans-serif" font-size="20" font-weight="400">Building security tooling, satellite-telemetry AI and geospatial systems.</text>

  <!-- Tags Bar -->
  <g font-family="monospace" font-size="13" font-weight="bold">
    <rect x="100" y="440" width="160" height="38" rx="8" fill="#1e293b"/>
    <text x="120" y="464" fill="#38bdf8">Astrovia (SIH '26)</text>

    <rect x="280" y="440" width="140" height="38" rx="8" fill="#1e293b"/>
    <text x="300" y="464" fill="#34d399">SentinelAI SIEM</text>

    <rect x="440" y="440" width="120" height="38" rx="8" fill="#1e293b"/>
